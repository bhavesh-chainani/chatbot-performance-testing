# Chatbot API Configuration
chatbot:
  url: "https://cfoti.org"
  api_endpoints:
    chat: "/api/chat/stream"
    tickets: "/api/tickets"
    userme: "/api/user/me"
  sso:
    login_url: "https://member-uat.sbf.org.sg/sbfportal/services/Account.Login.Service.ss?n=2&c=6422571_SB2"

# =============================================================================
# Test Profiles
# Select which test to run via TEST_TYPE env var (load, stress, endurance, breakpoint)
# Primary metric: End-to-End Response Time
# =============================================================================

# Load Test - baseline performance under expected load
load_test:
  users: 10
  spawn_rate: 2
  run_time: "5m"

# Stress Test - performance beyond normal capacity
stress_test:
  users: 10
  spawn_rate: 2
  run_time: "5m"

# Endurance Test - sustained load over extended period
endurance_test:
  users: 10
  spawn_rate: 2
  run_time: "10m"

# Breakpoint Test - ramp up until failure
breakpoint_test:
  max_users: 20
  ramp_users_per_step: 5
  step_duration_seconds: 60
  run_time: "5m"
