# Base URL and API paths (override with CHATBOT_URL etc. in .env if needed)
chatbot:
  url: "https://cfoti.org"
  api_endpoints:
    chat: "/api/chat/stream"
    tickets: "/api/tickets"
    userme: "/api/user/me"

# Defaults used when you start Locust without overriding in the web UI.
# Override via env, e.g. LOAD_TEST_USERS=50 LOAD_TEST_RUN_TIME=10m
load_test:
  users: 50
  spawn_rate: 5
  run_time: "10m"

stress_test:
  users: 100
  spawn_rate: 10
  run_time: "10m"

endurance_test:
  users: 50
  spawn_rate: 5
  run_time: "30m"

breakpoint_test:
  max_users: 200
  ramp_users_per_step: 20
  step_duration_seconds: 60
  run_time: "20m"
