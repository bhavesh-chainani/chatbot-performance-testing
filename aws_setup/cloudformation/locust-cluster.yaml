AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Locust load-testing cluster sized for chatbot performance tests
  (500-1000 concurrent users across load / stress / endurance / breakpoint tests)

Parameters:
  InstanceTypeMaster:
    Type: String
    Default: c5.large
    Description: Master node – hosts web UI and coordinates workers
    AllowedValues:
      - t3.medium
      - t3.large
      - c5.large
      - c5.xlarge

  InstanceTypeWorker:
    Type: String
    Default: c5.xlarge
    Description: Worker nodes – generate virtual user load
    AllowedValues:
      - t3.large
      - t3.xlarge
      - c5.large
      - c5.xlarge
      - c5.2xlarge

  WorkerCount:
    Type: Number
    Default: 3
    MinValue: 1
    MaxValue: 5
    Description: >
      Number of worker instances.
      Guidance: 2 workers for 500 users, 3 for 750, 4-5 for 1000.

  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: EC2 Key Pair for SSH access

  AllowedCIDR:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR allowed to access Locust web UI and SSH

Conditions:
  HasWorker1: !Or [!Equals [!Ref WorkerCount, 1], !Equals [!Ref WorkerCount, 2], !Equals [!Ref WorkerCount, 3], !Equals [!Ref WorkerCount, 4], !Equals [!Ref WorkerCount, 5]]
  HasWorker2: !Or [!Equals [!Ref WorkerCount, 2], !Equals [!Ref WorkerCount, 3], !Equals [!Ref WorkerCount, 4], !Equals [!Ref WorkerCount, 5]]
  HasWorker3: !Or [!Equals [!Ref WorkerCount, 3], !Equals [!Ref WorkerCount, 4], !Equals [!Ref WorkerCount, 5]]
  HasWorker4: !Or [!Equals [!Ref WorkerCount, 4], !Equals [!Ref WorkerCount, 5]]
  HasWorker5: !Equals [!Ref WorkerCount, 5]

Resources:
  LocustSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Locust cluster security group
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8089
          ToPort: 8089
          CidrIp: !Ref AllowedCIDR
          Description: Locust web UI
        - IpProtocol: tcp
          FromPort: 5557
          ToPort: 5558
          CidrIp: 0.0.0.0/0
          Description: Locust master-worker communication
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedCIDR
          Description: SSH access

  # ---------- User-data shared bootstrap ----------
  # Each instance installs Python deps and creates the project directory.

  LocustMasterInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: ami-0c55b159cbfafe1f0   # Amazon Linux 2 – replaced at deploy time
      InstanceType: !Ref InstanceTypeMaster
      KeyName: !Ref KeyPairName
      SecurityGroupIds:
        - !Ref LocustSecurityGroup
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum update -y
          yum install -y python3 python3-pip git
          pip3 install locust pyyaml python-dotenv requests boto3
          mkdir -p /home/ec2-user/chatbot-performance-testing/reports
          chown -R ec2-user:ec2-user /home/ec2-user/chatbot-performance-testing
      Tags:
        - Key: Name
          Value: locust-master
        - Key: Purpose
          Value: load-testing

  LocustWorker1:
    Type: AWS::EC2::Instance
    Condition: HasWorker1
    Properties:
      ImageId: ami-0c55b159cbfafe1f0
      InstanceType: !Ref InstanceTypeWorker
      KeyName: !Ref KeyPairName
      SecurityGroupIds:
        - !Ref LocustSecurityGroup
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum update -y
          yum install -y python3 python3-pip git
          pip3 install locust pyyaml python-dotenv requests boto3
          mkdir -p /home/ec2-user/chatbot-performance-testing
          chown -R ec2-user:ec2-user /home/ec2-user/chatbot-performance-testing
      Tags:
        - Key: Name
          Value: locust-worker-1

  LocustWorker2:
    Type: AWS::EC2::Instance
    Condition: HasWorker2
    Properties:
      ImageId: ami-0c55b159cbfafe1f0
      InstanceType: !Ref InstanceTypeWorker
      KeyName: !Ref KeyPairName
      SecurityGroupIds:
        - !Ref LocustSecurityGroup
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum update -y
          yum install -y python3 python3-pip git
          pip3 install locust pyyaml python-dotenv requests boto3
          mkdir -p /home/ec2-user/chatbot-performance-testing
          chown -R ec2-user:ec2-user /home/ec2-user/chatbot-performance-testing
      Tags:
        - Key: Name
          Value: locust-worker-2

  LocustWorker3:
    Type: AWS::EC2::Instance
    Condition: HasWorker3
    Properties:
      ImageId: ami-0c55b159cbfafe1f0
      InstanceType: !Ref InstanceTypeWorker
      KeyName: !Ref KeyPairName
      SecurityGroupIds:
        - !Ref LocustSecurityGroup
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum update -y
          yum install -y python3 python3-pip git
          pip3 install locust pyyaml python-dotenv requests boto3
          mkdir -p /home/ec2-user/chatbot-performance-testing
          chown -R ec2-user:ec2-user /home/ec2-user/chatbot-performance-testing
      Tags:
        - Key: Name
          Value: locust-worker-3

  LocustWorker4:
    Type: AWS::EC2::Instance
    Condition: HasWorker4
    Properties:
      ImageId: ami-0c55b159cbfafe1f0
      InstanceType: !Ref InstanceTypeWorker
      KeyName: !Ref KeyPairName
      SecurityGroupIds:
        - !Ref LocustSecurityGroup
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum update -y
          yum install -y python3 python3-pip git
          pip3 install locust pyyaml python-dotenv requests boto3
          mkdir -p /home/ec2-user/chatbot-performance-testing
          chown -R ec2-user:ec2-user /home/ec2-user/chatbot-performance-testing
      Tags:
        - Key: Name
          Value: locust-worker-4

  LocustWorker5:
    Type: AWS::EC2::Instance
    Condition: HasWorker5
    Properties:
      ImageId: ami-0c55b159cbfafe1f0
      InstanceType: !Ref InstanceTypeWorker
      KeyName: !Ref KeyPairName
      SecurityGroupIds:
        - !Ref LocustSecurityGroup
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum update -y
          yum install -y python3 python3-pip git
          pip3 install locust pyyaml python-dotenv requests boto3
          mkdir -p /home/ec2-user/chatbot-performance-testing
          chown -R ec2-user:ec2-user /home/ec2-user/chatbot-performance-testing
      Tags:
        - Key: Name
          Value: locust-worker-5

Outputs:
  MasterPublicIP:
    Description: Public IP of Locust master (SSH + web UI)
    Value: !GetAtt LocustMasterInstance.PublicIp
    Export:
      Name: !Sub '${AWS::StackName}-MasterIP'

  MasterPrivateIP:
    Description: Private IP of Locust master (worker --master-host)
    Value: !GetAtt LocustMasterInstance.PrivateIp
    Export:
      Name: !Sub '${AWS::StackName}-MasterPrivateIP'

  LocustWebUI:
    Description: URL for Locust web UI
    Value: !Sub 'http://${LocustMasterInstance.PublicIp}:8089'

  SecurityGroupId:
    Description: Security Group ID
    Value: !Ref LocustSecurityGroup
    Export:
      Name: !Sub '${AWS::StackName}-SecurityGroup'
