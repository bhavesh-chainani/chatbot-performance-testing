AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Single EC2 instance for chatbot performance testing (10-20 concurrent users).
  No distributed mode needed – Locust runs standalone.

Parameters:
  InstanceType:
    Type: String
    Default: t3.small
    Description: EC2 instance type (t3.small is plenty for 10-20 users)
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium

  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: EC2 Key Pair for SSH access

  AllowedCIDR:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR allowed to access Locust web UI and SSH

Resources:
  LocustSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Locust single-instance security group
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8089
          ToPort: 8089
          CidrIp: !Ref AllowedCIDR
          Description: Locust web UI
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedCIDR
          Description: SSH access

  LocustInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: ami-0c55b159cbfafe1f0   # Amazon Linux 2 – replaced at deploy time
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyPairName
      SecurityGroupIds:
        - !Ref LocustSecurityGroup
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum update -y
          yum install -y python3 python3-pip git
          pip3 install locust pyyaml python-dotenv requests boto3
          pip3 install "urllib3<2.0" --upgrade
          mkdir -p /home/ec2-user/chatbot-performance-testing/reports
          chown -R ec2-user:ec2-user /home/ec2-user/chatbot-performance-testing
      Tags:
        - Key: Name
          Value: locust-testing
        - Key: Purpose
          Value: load-testing

Outputs:
  InstancePublicIP:
    Description: Public IP (SSH + web UI)
    Value: !GetAtt LocustInstance.PublicIp
    Export:
      Name: !Sub '${AWS::StackName}-PublicIP'

  LocustWebUI:
    Description: Locust web UI URL
    Value: !Sub 'http://${LocustInstance.PublicIp}:8089'

  SecurityGroupId:
    Description: Security Group ID
    Value: !Ref LocustSecurityGroup
